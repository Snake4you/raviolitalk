; Canfunk Walkie-Talkie
; Framework: ESP-IDF (via PlatformIO)
;
;   pio run -e retro-phone   ESP32-S3 (bread-compact-wifi board)
;   pio run -e toy-c3        SpotPear Toy-AI-Core-C3-MINI (ESP32-C3 + ES8311)
;
; ─── Einstellungen ───────────────────────────────────────────────────────────
; Jede Option ist optional. Zum Aktivieren die Zeile unter "build_flags" des
; gewuenschten Boards einkommentieren (fuehrendes ";" entfernen, Einrueckung
; behalten). Nicht gesetzte Optionen behalten den Standardwert aus src/config.h.
; Optionen unter [settings] gelten fuer beide Boards.
;
; Achtung: Lautstaerke, Modus und VOX-Stufe sind nur Startwerte fuer Geraete ohne
; gespeicherte Einstellung. Funkkanal und WLAN-/OTA-Zugangsdaten muessen auf allen
; Dosen gleich sein.
;
; Eigene Zugangsdaten (Hotspot, Passwoerter) nicht hier eintragen, sondern in
; platformio_local.ini (wird von git ignoriert). Vorlage:
;   cp platformio_local.ini.example platformio_local.ini
; Ein [settings]-Abschnitt dort ersetzt den Abschnitt [settings] dieser Datei.

[platformio]
default_envs = retro-phone
extra_configs = platformio_local*.ini

[settings]
build_flags =
    ; --- Funk / OTA (auf allen Dosen gleich einstellen) ---
    ; -DESPNOW_CHANNEL=13                       ; WLAN-Kanal 1..13 ohne Hotspot
    ; '-DOTA_WIFI_SSID="Canfunk-OTA"'           ; Hotspot fuer das OTA-Update
    ; '-DOTA_WIFI_PASSWORD="canfunk-ota"'       ; WLAN-Passwort des Hotspots (min. 8 Zeichen)
    ; '-DOTA_HTTP_PASSWORD="canfunk"'           ; Passwort der OTA-Webseite
    ; --- Startwerte (nur fuer Geraete ohne gespeicherte Einstellung) ---
    ; -DDEFAULT_VOLUME=5                        ; Lautstaerke 1..10
    ; -DDEFAULT_VOX_SENS=6                      ; VOX-Empfindlichkeit 1..10
    ; -DDEFAULT_PTT_MODE_VOX=1                  ; 1 = VOX, 0 = TILT/Taste
    ; --- Klingeln (Dose kurbeln -> Dosen auf dem Kopf klingeln) ---
    ; -DRING_TONE_LEVEL=3.0f                    ; Klingelton-Pegel relativ zu den anderen Toenen
    ; -DRING_SEND_COOLDOWN_MS=10000             ; Sender: Pause nach dem Kurbeln (ms)
    ; -DRING_RX_COOLDOWN_MS=10000               ; Empfaenger: Pause nach einem Klingeln (ms)

[env]
platform = espressif32@6.7.0
framework = espidf
monitor_speed = 115200
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = partitions.csv

[env:retro-phone]
board = esp32-s3-devkitc-1
build_flags =
    ${settings.build_flags}
    ; --- TILT (ADXL345), Standard auf diesem Board: an ---
    ; -DTILT_ENABLE=0                           ; 0 = ohne Sensor (nur Taste/VOX)
    ; -DADXL_I2C_ADDR=0x53                      ; feste Adresse (0x53 oder 0x1D), sonst beide probieren
    ; -DPIN_I2C_SDA=GPIO_NUM_41                 ; I2C-Pins des Sensors
    ; -DPIN_I2C_SCL=GPIO_NUM_42

[env:toy-c3]
board = esp32-c3-devkitm-1
build_flags =
    -DBOARD_TOY_AI_CORE_C3
    ${settings.build_flags}
    ; --- TILT (ADXL345), Standard auf diesem Board: aus (kein Sensor verbaut) ---
    ; Sensor am Display-Stecker anschliessen (FPC Pin 17 = SCL, Pin 18 = SDA).
    ; Die I2C-Pins sind hier fest, weil der Audio-Codec am selben Bus haengt.
    ; -DTILT_ENABLE=1                           ; 1 = Sensor angeschlossen
    ; -DADXL_I2C_ADDR=0x53                      ; feste Adresse (0x53 oder 0x1D), sonst beide probieren
    ; --- Audio ---
    ; -DES8311_MIC_GAIN=4                       ; Mikrofon-Verstaerkung 0..7 (je 6 dB)
